# =============================================================================
# Frontend CI/CD — Gitea Actions Workflow
#
# Workflows supported:
# 1. Push to develop/dev:
#    - Builds image tagged with dev-<sha> and dev-latest with BuildKit caching.
#    - Loads centralized environments/dev/frontend.env (api.dev.inshop.social).
#    - Deploys automatically to DEV environment: dev_application_frontend /
#      dev_application_dev_frontend (dev.inshop.social).
#
# 2. Release Tag (*) or Gitea Release:
#    - Rebuilds project with production environment (api.inshop.social).
#    - Uses BuildKit layer caching (cache-deps-<hash> intermediate stage and release tags)
#      with BUILDKIT_INLINE_CACHE for instant dependency cache hits and fast rebuilds.
#    - Tags with <tag>, prod-<sha>, and prod-latest.
#    - Deploys automatically to PROD environment: application_frontend (inshop.social).
#
# 3. Push to master/main:
#    - Builds production image tagged with prod-<sha> and prod-latest.
#    - Deploys automatically to PROD environment: application_frontend (inshop.social).
#
# 4. workflow_dispatch:
#    - Manual deployment to dev or prod with optional custom tag and environment choice.
# =============================================================================
name: frontend-ci-cd

on:
  push:
    branches:
      - master
      - main
      - develop
      - dev
    tags:
      - '*'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment to build and deploy'
        type: choice
        options:
          - production
          - dev
        default: 'production'
      release_tag:
        description: 'Optional custom image tag (e.g. v1.0.0 or leave empty)'
        type: string
        default: ''

env:
  IMAGE: "${{ vars.REGISTRY_HOST }}/inshop/frontend"
  DOCKER_BUILDKIT: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Image & Push to Registry (Cached with BuildKit)
  # ---------------------------------------------------------------------------
  build-image:
    runs-on: docker
    outputs:
      digest: "${{ steps.push.outputs.digest }}"
      is_dev: "${{ steps.target.outputs.is_dev }}"
      primary_tag: "${{ steps.target.outputs.primary_tag }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Target Environment & Tags
        id: target
        run: |
          set -euo pipefail

          # 1. Release tag push or release event -> Production build
          if [[ "${GITHUB_REF}" == refs/tags/* ]] || [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            REF_TAG="${GITHUB_REF_NAME:-}"
            if [ -z "${REF_TAG}" ]; then
              REF_TAG="${GITHUB_REF#refs/tags/}"
            fi
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "target_env=prod" >> "$GITHUB_OUTPUT"
            echo "primary_tag=${REF_TAG}" >> "$GITHUB_OUTPUT"
            echo "extra_tags=prod-latest prod-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "Target: PRODUCTION (Release Tag: ${REF_TAG})"

          # 2. Develop / Dev branch push -> Dev build
          elif [ "${GITHUB_REF}" = "refs/heads/develop" ] || [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
            echo "target_env=dev" >> "$GITHUB_OUTPUT"
            echo "primary_tag=dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "extra_tags=dev-latest" >> "$GITHUB_OUTPUT"
            echo "Target: DEVELOPMENT (Branch: ${GITHUB_REF})"

          # 3. Manual workflow_dispatch
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TARGET_CHOICE="${{ inputs.target_env || 'production' }}"
            CUSTOM_TAG="${{ inputs.release_tag || '' }}"
            if [ "${TARGET_CHOICE}" = "dev" ]; then
              TAG="${CUSTOM_TAG:-dev-${GITHUB_SHA}}"
              echo "is_dev=true" >> "$GITHUB_OUTPUT"
              echo "target_env=dev" >> "$GITHUB_OUTPUT"
              echo "primary_tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "extra_tags=dev-latest" >> "$GITHUB_OUTPUT"
              echo "Target: DEVELOPMENT (Manual dispatch, tag: ${TAG})"
            else
              TAG="${CUSTOM_TAG:-prod-${GITHUB_SHA}}"
              echo "is_dev=false" >> "$GITHUB_OUTPUT"
              echo "target_env=prod" >> "$GITHUB_OUTPUT"
              echo "primary_tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "extra_tags=prod-latest" >> "$GITHUB_OUTPUT"
              echo "Target: PRODUCTION (Manual dispatch, tag: ${TAG})"
            fi

          # 4. Master / Main branch push or other branches -> Production build
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "target_env=prod" >> "$GITHUB_OUTPUT"
            echo "primary_tag=prod-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "extra_tags=prod-latest" >> "$GITHUB_OUTPUT"
            echo "Target: PRODUCTION (Branch: ${GITHUB_REF})"
          fi

      - name: Configure npm client for container build
        env:
          NPM_USER: "${{ secrets.NPM_USER }}"
          NPM_PASS: "${{ secrets.NPM_PASS }}"
        run: |
          set -euo pipefail
          test -f .npmrc
          if [ -n "${NPM_USER:-}" ] && [ -n "${NPM_PASS:-}" ]; then
            npm_registry="$(npm config get registry --userconfig .npmrc)"
            npm_host="$(node -e "console.log(new URL(process.argv[1]).host)" "$npm_registry")"
            npm_auth="$(printf '%s:%s' "$NPM_USER" "$NPM_PASS" | base64 | tr -d '\n')"
            cp .npmrc .npmrc.ci
            {
              echo "//$npm_host/:_auth=$npm_auth"
              echo "ignore-scripts=true"
            } >> .npmrc.ci
          else
            cp .npmrc .npmrc.ci
          fi

      - name: Log in to the internal registry
        run: echo "${{ secrets.REGISTRY_PASS }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Manage dependencies stage cache (cache-deps-<hash>)
        id: deps-cache
        run: |
          set -euo pipefail

          # Compute content hash of package manifests and configuration
          DEPS_FILES=("package.json" "package-lock.json")
          if [ -f ".npmrc" ]; then
            DEPS_FILES+=(".npmrc")
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            HASH_CMD="sha256sum"
          else
            HASH_CMD="shasum -a 256"
          fi

          DEPS_HASH=$($HASH_CMD "${DEPS_FILES[@]}" | $HASH_CMD | cut -c1-16)
          CACHE_DEPS_TAG="${IMAGE}:cache-deps-${DEPS_HASH}"
          CACHE_DEPS_LATEST="${IMAGE}:cache-deps-latest"

          echo "deps_hash=${DEPS_HASH}" >> "$GITHUB_OUTPUT"
          echo "cache_deps_tag=${CACHE_DEPS_TAG}" >> "$GITHUB_OUTPUT"
          echo "cache_deps_latest=${CACHE_DEPS_LATEST}" >> "$GITHUB_OUTPUT"

          echo "=========================================================="
          echo "Dependencies Cache Key: ${DEPS_HASH}"
          echo "Target Deps Cache Tag:  ${CACHE_DEPS_TAG}"
          echo "=========================================================="

          # Check if remote deps cache image already exists in registry
          check_remote_image() {
            local img="$1"
            export DOCKER_CLI_EXPERIMENTAL=enabled
            if docker manifest inspect "${img}" >/dev/null 2>&1; then
              return 0
            fi
            if command -v docker >/dev/null 2>&1 && docker buildx imagetools inspect "${img}" >/dev/null 2>&1; then
              return 0
            fi
            return 1
          }

          if check_remote_image "${CACHE_DEPS_TAG}"; then
            echo "✓ Found existing deps cache in registry: ${CACHE_DEPS_TAG}"
            echo "Skipping deps stage build and reusing registry cache."
          else
            echo "Dependencies modified or cache missed. Building deps stage..."
            SECRET_ARGS=()
            if [ -f ".npmrc.ci" ]; then
              SECRET_ARGS+=(--secret id=npmrc,src=.npmrc.ci)
            fi

            docker build \
              --target deps \
              --cache-from "${CACHE_DEPS_LATEST}" \
              --cache-from "${IMAGE}:prod-latest" \
              --cache-from "${IMAGE}:dev-latest" \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              "${SECRET_ARGS[@]}" \
              -t "${CACHE_DEPS_TAG}" \
              -t "${CACHE_DEPS_LATEST}" .

            echo "Pushing built deps cache to registry..."
            docker push "${CACHE_DEPS_TAG}"
            docker push "${CACHE_DEPS_LATEST}"
            echo "✓ Successfully pushed deps cache to ${CACHE_DEPS_TAG}"
          fi

      - name: Fetch centralized environment config
        run: |
          set -euo pipefail
          TARGET_ENV="${{ steps.target.outputs.target_env }}"
          echo "Fetching centralized environment for: ${TARGET_ENV}..."
          mkdir -p .infra-env
          if git clone --depth 1 http://meri:InShopAdminMeri2026%21@gitea:3000/Mohsen/inshop-infrastructure.git .infra-env 2>/dev/null || \
             git clone --depth 1 https://meri:InShopAdminMeri2026%21@git.inshop.social/Mohsen/inshop-infrastructure.git .infra-env 2>/dev/null || \
             git clone --depth 1 https://git.inshop.social/Mohsen/inshop-infrastructure.git .infra-env 2>/dev/null; then
            if [ -f ".infra-env/environments/${TARGET_ENV}/frontend.env" ]; then
              cp ".infra-env/environments/${TARGET_ENV}/frontend.env" ./active-frontend.env
              echo "Successfully loaded centralized environments/${TARGET_ENV}/frontend.env"
            elif [ "${TARGET_ENV}" = "dev" ] && [ -f ".infra-env/environments/development/frontend.env" ]; then
              cp ".infra-env/environments/development/frontend.env" ./active-frontend.env
              echo "Successfully loaded centralized environments/development/frontend.env"
            elif [ "${TARGET_ENV}" = "prod" ] && [ -f ".infra-env/environments/production/frontend.env" ]; then
              cp ".infra-env/environments/production/frontend.env" ./active-frontend.env
              echo "Successfully loaded centralized environments/production/frontend.env"
            fi
          fi
          test -f ./active-frontend.env || touch ./active-frontend.env

      - name: Build Next.js image with BuildKit cache
        run: |
          set -euo pipefail
          BUILD_ARGS=()
          PRIMARY_TAG="${{ steps.target.outputs.primary_tag }}"
          IS_DEV="${{ steps.target.outputs.is_dev }}"

          if [ -s "./active-frontend.env" ]; then
            echo "Building with centralized environment arguments:"
            while IFS= read -r line || [ -n "$line" ]; do
              line="$(echo "${line}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [[ -z "${line}" || "${line}" =~ ^# ]] && continue
              if [[ "${line}" =~ = ]]; then
                k="${line%%=*}"
                v="${line#*=}"
                v="${v%\"}"
                v="${v#\"}"
                v="${v%\'}"
                v="${v#\'}"
                # Always set this below from the workflow target. This prevents
                # a stale repository variable or wrong env file from embedding
                # the dev API URL in a production release image.
                if [ "${k}" != "NEXT_PUBLIC_API_URL" ]; then
                  BUILD_ARGS+=(--build-arg "${k}=${v}")
                  echo "  -> ${k}=${v}"
                fi
              fi
            done < "./active-frontend.env"

            # Ensure release tag is accurately recorded in Sentry for production release tags
            if [ "${IS_DEV}" != "true" ]; then
              BUILD_ARGS+=(--build-arg "NEXT_PUBLIC_SENTRY_RELEASE=${PRIMARY_TAG}")
              BUILD_ARGS+=(--build-arg "SENTRY_RELEASE=${PRIMARY_TAG}")
            fi
          else
            echo "Falling back to default repository build arguments..."
            BUILD_ARGS+=(
              --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL || (steps.target.outputs.is_dev == 'true' && 'https://api.dev.inshop.social' || 'https://api.inshop.social') }}"
              --build-arg NEXT_PUBLIC_CDN_URL="${{ vars.NEXT_PUBLIC_CDN_URL || 'https://storage.inshop.social' }}"
              --build-arg NEXT_PUBLIC_DEBUG_AUTH="${{ vars.NEXT_PUBLIC_DEBUG_AUTH || 'false' }}"
              --build-arg NEXT_PUBLIC_GLITCHTIP_DSN="${{ vars.NEXT_PUBLIC_GLITCHTIP_DSN || 'https://c39862cad26a45aaa1f72b6e9e8c50dc@errors.inshop.social/5' }}"
              --build-arg NEXT_PUBLIC_SENTRY_RELEASE="${PRIMARY_TAG}"
              --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT="${{ steps.target.outputs.is_dev == 'true' && 'development' || 'production' }}"
              --build-arg E2E_MOCK="false"
            )
          fi

          if [ "${IS_DEV}" = "true" ]; then
            EXPECTED_API_URL="https://api.dev.inshop.social"
          else
            EXPECTED_API_URL="https://api.inshop.social"
          fi
          BUILD_ARGS+=(--build-arg "NEXT_PUBLIC_API_URL=${EXPECTED_API_URL}")
          echo "  -> NEXT_PUBLIC_API_URL=${EXPECTED_API_URL}"

          # Enable BuildKit inline cache for downstream cache reuse
          BUILD_ARGS+=(--build-arg BUILDKIT_INLINE_CACHE=1)

          TAG_ARGS=(-t "${IMAGE}:${PRIMARY_TAG}")
          for extra in ${{ steps.target.outputs.extra_tags }}; do
            TAG_ARGS+=(-t "${IMAGE}:${extra}")
          done

          CACHE_DEPS_TAG="${{ steps.deps-cache.outputs.cache_deps_tag }}"
          CACHE_DEPS_LATEST="${{ steps.deps-cache.outputs.cache_deps_latest }}"

          echo "Running docker build with caching from deps cache and release tags..."
          docker build \
            --cache-from "${CACHE_DEPS_TAG}" \
            --cache-from "${CACHE_DEPS_LATEST}" \
            --cache-from "${IMAGE}:prod-latest" \
            --cache-from "${IMAGE}:dev-latest" \
            --secret id=npmrc,src=.npmrc.ci \
            "${BUILD_ARGS[@]}" \
            "${TAG_ARGS[@]}" .

      - name: Push and capture digest
        id: push
        run: |
          set -euo pipefail
          PRIMARY_TAG="${{ steps.target.outputs.primary_tag }}"

          echo "Pushing primary tag: ${IMAGE}:${PRIMARY_TAG}"
          docker push "${IMAGE}:${PRIMARY_TAG}"

          for extra in ${{ steps.target.outputs.extra_tags }}; do
            echo "Pushing extra tag: ${IMAGE}:${extra}"
            docker push "${IMAGE}:${extra}"
          done

          digest=$(docker inspect --format='{{ index .RepoDigests 0 }}' "${IMAGE}:${PRIMARY_TAG}")
          if ! printf '%s\n' "${digest}" | grep -Eq '^.+@sha256:[0-9a-f]{64}$'; then
            echo "::error::Docker returned an invalid image digest: ${digest}"
            exit 1
          fi
          echo "Captured Repo Digest: ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Deploy to Dev (dev_application_dev_frontend)
  # ---------------------------------------------------------------------------
  deploy-dev:
    needs: build-image
    if: needs.build-image.outputs.is_dev == 'true'
    runs-on: swarm-deploy
    env:
      SERVICE: "dev_application_dev_frontend"
    steps:
      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASS }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Deploy to DEV Environment (dev_application_dev_frontend)
        run: |
          set -euo pipefail
          DIGEST="${{ needs.build-image.outputs.digest }}"

          TARGET_SVC="${SERVICE}"
          if ! docker service inspect "${TARGET_SVC}" >/dev/null 2>&1; then
            if docker service inspect "dev_application_frontend" >/dev/null 2>&1; then
              TARGET_SVC="dev_application_frontend"
            else
              echo "::error::Service '${TARGET_SVC}' does not exist in Docker Swarm."
              exit 1
            fi
          fi

          echo "Updating Docker Swarm service: ${TARGET_SVC} -> ${DIGEST}"
          docker service update \
            --image "${DIGEST}" \
            --update-order start-first \
            --update-failure-action rollback \
            --with-registry-auth \
            "${TARGET_SVC}"

      - name: Verify service status
        run: |
          set -euo pipefail
          echo "Waiting for ${SERVICE} tasks..."
          sleep 10
          docker service ps "${SERVICE}" --filter "desired-state=running" --no-trunc
          running_count=$(docker service ps "${SERVICE}" --filter "desired-state=running" -q | wc -l | tr -d ' ')
          echo "Active running tasks: ${running_count}"
          test "${running_count}" -gt 0
          echo "Dev frontend successfully deployed!"

  # ---------------------------------------------------------------------------
  # 3. Deploy to Production (application_frontend)
  # ---------------------------------------------------------------------------
  deploy-prod:
    needs: build-image
    if: needs.build-image.outputs.is_dev == 'false'
    runs-on: swarm-deploy
    env:
      SERVICE: "application_frontend"
    steps:
      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASS }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Deploy to Production (application_frontend)
        run: |
          set -euo pipefail
          DIGEST="${{ needs.build-image.outputs.digest }}"
          echo "Updating ${SERVICE} to ${DIGEST}..."
          docker service update \
            --image "${DIGEST}" \
            --update-order start-first \
            --update-failure-action rollback \
            --with-registry-auth \
            "${SERVICE}"

      - name: Verify production service status
        run: |
          set -euo pipefail
          echo "Waiting for ${SERVICE} tasks..."
          sleep 10
          docker service ps "${SERVICE}" --filter "desired-state=running" --no-trunc
          running_count=$(docker service ps "${SERVICE}" --filter "desired-state=running" -q | wc -l | tr -d ' ')
          echo "Active running tasks: ${running_count}"
          test "${running_count}" -gt 0
          echo "Production frontend successfully deployed with newly built production image!"
