# =============================================================================
# Frontend CI/CD — Gitea Actions Workflow
#
# Workflows supported:
# 1. Push to develop/dev:
#    - Builds image tagged with dev-<sha> and dev-latest.
#    - Deploys automatically to DEV environment: dev_application_frontend
#      (dev.inshop.social).
#
# 2. Release Tag (v*) or Gitea Release:
#    - Zero-rebuild Docker image promotion:
#      Pulls the tested dev image, re-tags it to the release tag and prod-latest,
#      pushes to registry, and deploys the exact immutable digest to production:
#      application_frontend (inshop.social).
#
# 3. workflow_dispatch:
#    - Manual deployment to dev or one-click promotion to prod.
# =============================================================================
name: frontend-ci-cd

on:
  push:
    branches:
      - master
      - main
      - develop
      - dev
    tags:
      - 'v*'
      - 'release-*'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      promote_to_prod:
        description: 'Promote tested dev image to production (re-tag without rebuild)'
        type: boolean
        default: false
      source_tag:
        description: 'Source dev tag to promote (e.g. dev-latest or dev-<sha>)'
        type: string
        default: 'dev-latest'
      release_tag:
        description: 'Production release tag (e.g. v1.0.0 or prod-latest)'
        type: string
        default: 'prod-latest'

env:
  IMAGE: "${{ vars.REGISTRY_HOST }}/inshop/frontend"
  DOCKER_BUILDKIT: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Dev Image & Push to Registry
  # ---------------------------------------------------------------------------
  build-dev:
    if: (!startsWith(github.ref, 'refs/tags/')) && github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.promote_to_prod != true)
    runs-on: docker
    outputs:
      digest: "${{ steps.push.outputs.digest }}"
      is_dev: "${{ steps.target.outputs.is_dev }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Target Branch
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ] || [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
            echo "image_tag=dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "image_tag=prod-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure npm client for container build
        env:
          NPM_USER: "${{ secrets.NPM_USER }}"
          NPM_PASS: "${{ secrets.NPM_PASS }}"
        run: |
          set -euo pipefail
          test -f .npmrc
          if [ -n "${NPM_USER:-}" ] && [ -n "${NPM_PASS:-}" ]; then
            npm_registry="$(npm config get registry --userconfig .npmrc)"
            npm_host="$(node -e "console.log(new URL(process.argv[1]).host)" "$npm_registry")"
            npm_auth="$(printf '%s:%s' "$NPM_USER" "$NPM_PASS" | base64 | tr -d '\n')"
            cp .npmrc .npmrc.ci
            {
              echo "//$npm_host/:_auth=$npm_auth"
              echo "ignore-scripts=true"
            } >> .npmrc.ci
          else
            cp .npmrc .npmrc.ci
          fi

      - name: Log in to the internal registry
        run: echo "${{ secrets.REGISTRY_PASS }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Fetch centralized environment config
        run: |
          set -euo pipefail
          TARGET_ENV="${{ steps.target.outputs.is_dev == 'true' && 'development' || 'production' }}"
          echo "Fetching centralized environment for: ${TARGET_ENV}..."
          mkdir -p .infra-env
          if git clone --depth 1 https://meri:InShopAdminMeri2026%21@git.inshop.social/Mohsen/inshop-infrastructure.git .infra-env 2>/dev/null || \
             git clone --depth 1 https://git.inshop.social/Mohsen/inshop-infrastructure.git .infra-env 2>/dev/null; then
            if [ -f ".infra-env/environments/${TARGET_ENV}/frontend.env" ]; then
              cp ".infra-env/environments/${TARGET_ENV}/frontend.env" ./active-frontend.env
              echo "Successfully loaded centralized environments/${TARGET_ENV}/frontend.env"
            fi
          fi
          test -f ./active-frontend.env || touch ./active-frontend.env

      - name: Build Next.js image
        run: |
          set -euo pipefail
          BUILD_ARGS=()
          if [ -s "./active-frontend.env" ]; then
            echo "Building with centralized environment arguments:"
            while IFS= read -r line || [ -n "$line" ]; do
              line="$(echo "${line}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [[ -z "${line}" || "${line}" =~ ^# ]] && continue
              if [[ "${line}" =~ = ]]; then
                k="${line%%=*}"
                v="${line#*=}"
                v="${v%\"}"
                v="${v#\"}"
                v="${v%\'}"
                v="${v#\'}"
                BUILD_ARGS+=(--build-arg "${k}=${v}")
                echo "  -> ${k}=${v}"
              fi
            done < "./active-frontend.env"
          else
            echo "Falling back to default repository build arguments..."
            BUILD_ARGS+=(
              --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL || (steps.target.outputs.is_dev == 'true' && 'https://api.dev.inshop.social' || 'https://api.inshop.social') }}"
              --build-arg NEXT_PUBLIC_CDN_URL="${{ vars.NEXT_PUBLIC_CDN_URL || 'https://storage.inshop.social' }}"
              --build-arg NEXT_PUBLIC_DEBUG_AUTH="${{ vars.NEXT_PUBLIC_DEBUG_AUTH || 'false' }}"
              --build-arg E2E_MOCK="false"
            )
          fi

          docker build \
            --secret id=npmrc,src=.npmrc.ci \
            "${BUILD_ARGS[@]}" \
            -t "${IMAGE}:${{ steps.target.outputs.image_tag }}" \
            -t "${IMAGE}:${{ steps.target.outputs.is_dev == 'true' && 'dev-latest' || 'prod-latest' }}" .

      - name: Push and capture digest
        id: push
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${{ steps.target.outputs.image_tag }}"
          if [ "${{ steps.target.outputs.is_dev }}" = "true" ]; then
            docker push "${IMAGE}:dev-latest"
          else
            docker push "${IMAGE}:prod-latest"
          fi
          digest=$(docker inspect --format='{{ index .RepoDigests 0 }}' "${IMAGE}:${{ steps.target.outputs.image_tag }}")
          echo "Captured Repo Digest: ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Deploy to Dev (dev_application_dev_frontend)
  # ---------------------------------------------------------------------------
  deploy-dev:
    needs: build-dev
    if: needs.build-dev.outputs.is_dev == 'true'
    runs-on: swarm-deploy
    env:
      SERVICE: "dev_application_dev_frontend"
    steps:
      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASS }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Deploy to DEV Environment (dev_application_dev_frontend)
        run: |
          set -euo pipefail
          DIGEST="${{ needs.build-dev.outputs.digest }}"

          TARGET_SVC="${SERVICE}"
          if ! docker service inspect "${TARGET_SVC}" >/dev/null 2>&1; then
            if docker service inspect "dev_application_frontend" >/dev/null 2>&1; then
              TARGET_SVC="dev_application_frontend"
            else
              echo "::error::Service '${TARGET_SVC}' does not exist in Docker Swarm."
              exit 1
            fi
          fi

          echo "Updating Docker Swarm service: ${SERVICE} -> ${DIGEST}"
          docker service update \
            --image "${DIGEST}" \
            --update-order start-first \
            --update-failure-action rollback \
            --with-registry-auth \
            "${SERVICE}"

      - name: Verify service status
        run: |
          set -euo pipefail
          echo "Waiting for ${SERVICE} tasks..."
          sleep 10
          docker service ps "${SERVICE}" --filter "desired-state=running" --no-trunc
          running_count=$(docker service ps "${SERVICE}" --filter "desired-state=running" -q | wc -l | tr -d ' ')
          echo "Active running tasks: ${running_count}"
          test "${running_count}" -gt 0

  # ---------------------------------------------------------------------------
  # 3. Deploy Direct Master/Main to Prod (application_frontend)
  # ---------------------------------------------------------------------------
  deploy-direct-prod:
    needs: build-dev
    if: needs.build-dev.outputs.is_dev == 'false'
    runs-on: swarm-deploy
    env:
      SERVICE: "application_frontend"
    steps:
      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASS }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Deploy to Production (application_frontend)
        run: |
          set -euo pipefail
          DIGEST="${{ needs.build-dev.outputs.digest }}"
          docker service update \
            --image "${DIGEST}" \
            --update-order start-first \
            --update-failure-action rollback \
            --with-registry-auth \
            "${SERVICE}"

  # ---------------------------------------------------------------------------
  # 4. Zero-Rebuild Promotion to Production (Release Tag / Release / Dispatch)
  # ---------------------------------------------------------------------------
  promote-to-prod:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.promote_to_prod == true)
    runs-on: swarm-deploy
    env:
      SERVICE: "application_frontend"
    steps:
      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASS }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Re-tag tested Docker image to production (NO REBUILD)
        id: retag
        shell: sh
        run: |
          set -eu
          SOURCE_TAG="${{ inputs.source_tag || format('dev-{0}', github.sha) }}"
          RELEASE_TAG="${{ inputs.release_tag || '' }}"
          if [ -z "${RELEASE_TAG}" ]; then
            if [ -n "${GITHUB_REF_NAME:-}" ]; then
              RELEASE_TAG="${GITHUB_REF_NAME}"
            else
              RELEASE_TAG="prod-${GITHUB_SHA}"
            fi
          fi

          echo "=========================================================="
          echo "[PROMOTE] Promoting tested dev frontend image to production:"
          echo "[PROMOTE] Source image: ${IMAGE}:${SOURCE_TAG}"
          echo "[PROMOTE] Target release tag: ${IMAGE}:${RELEASE_TAG}"
          echo "=========================================================="

          if ! docker pull "${IMAGE}:${SOURCE_TAG}" >/dev/null 2>&1; then
            echo "[PROMOTE] ${IMAGE}:${SOURCE_TAG} not found; falling back to ${IMAGE}:dev-latest..."
            SOURCE_TAG="dev-latest"
            docker pull "${IMAGE}:${SOURCE_TAG}"
          fi

          echo "[PROMOTE] Re-tagging without rebuilding..."
          docker tag "${IMAGE}:${SOURCE_TAG}" "${IMAGE}:${RELEASE_TAG}"
          docker tag "${IMAGE}:${SOURCE_TAG}" "${IMAGE}:prod-latest"
          docker tag "${IMAGE}:${SOURCE_TAG}" "${IMAGE}:prod-${GITHUB_SHA}"

          echo "[PROMOTE] Pushing new tags to registry..."
          docker push "${IMAGE}:${RELEASE_TAG}"
          docker push "${IMAGE}:prod-latest"
          docker push "${IMAGE}:prod-${GITHUB_SHA}"

          PROD_DIGEST=$(docker inspect --format='{{ index .RepoDigests 0 }}' "${IMAGE}:${RELEASE_TAG}")
          echo "[PROMOTE] Verified promoted digest: ${PROD_DIGEST}"
          echo "digest=${PROD_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Deploy exact promoted digest to Production (application_frontend)
        run: |
          set -euo pipefail
          DIGEST="${{ steps.retag.outputs.digest }}"
          echo "Updating ${SERVICE} to ${DIGEST}..."
          docker service update \
            --image "${DIGEST}" \
            --update-order start-first \
            --update-failure-action rollback \
            --with-registry-auth \
            "${SERVICE}"

      - name: Verify production service status
        run: |
          set -euo pipefail
          echo "Waiting for ${SERVICE} tasks..."
          sleep 10
          docker service ps "${SERVICE}" --filter "desired-state=running" --no-trunc
          running_count=$(docker service ps "${SERVICE}" --filter "desired-state=running" -q | wc -l | tr -d ' ')
          echo "Active running tasks: ${running_count}"
          test "${running_count}" -gt 0
          echo "Production frontend successfully deployed with zero rebuild!"
