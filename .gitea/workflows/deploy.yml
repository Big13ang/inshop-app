# =============================================================================
# Frontend CI/CD — Gitea Actions Workflow
# Builds, tests, and deploys the Next.js frontend application to Docker Swarm.
#
# Required Gitea repo secrets:  REGISTRY_USER, REGISTRY_PASS, NPM_USER, NPM_PASS
# Required repo variables:      REGISTRY_HOST (registry.inshop.social)
# NPM registry URL is read from the project .npmrc.

# =============================================================================
name: frontend-ci-cd

on:
  push:
    branches:
      - master
      - main
      - develop
  workflow_dispatch: {}

env:
  IMAGE: "${{ vars.REGISTRY_HOST }}/inshop/frontend"
  DOCKER_BUILDKIT: "1"

jobs:
  build-test-push:
    runs-on: docker
    outputs:
      digest: "${{ steps.push.outputs.digest }}"
      service: "${{ steps.env_info.outputs.service }}"
      release_name: "${{ steps.env_info.outputs.release_name }}"
      env_name: "${{ steps.env_info.outputs.env_name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Environment & Release Metadata
        id: env_info
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=production" >> "$GITHUB_OUTPUT"
            echo "release_name=prod-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "service=application_frontend" >> "$GITHUB_OUTPUT"
            echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "glitchtip_dsn=${{ vars.NEXT_PUBLIC_GLITCHTIP_DSN_PROD || vars.NEXT_PUBLIC_GLITCHTIP_DSN || 'https://c39862cad26a45aaa1f72b6e9e8c50dc@errors.inshop.social/5' }}" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=develop" >> "$GITHUB_OUTPUT"
            echo "release_name=develop-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "service=develop_application_frontend" >> "$GITHUB_OUTPUT"
            echo "image_tag=develop-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "glitchtip_dsn=${{ vars.NEXT_PUBLIC_GLITCHTIP_DSN_DEV || vars.NEXT_PUBLIC_GLITCHTIP_DSN || 'https://c39862cad26a45aaa1f72b6e9e8c50dc@errors.inshop.social/5' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure npm client for container build
        env:
          NPM_USER: "${{ secrets.NPM_USER }}"
          NPM_PASS: "${{ secrets.NPM_PASS }}"
        run: |
          set -euo pipefail
          test -f .npmrc
          if [ -z "${NPM_USER:-}" ] || [ -z "${NPM_PASS:-}" ]; then
            echo "::error:: NPM_USER or NPM_PASS secret is missing in Gitea repository secrets!"
            echo "Please set NPM_USER and NPM_PASS in Gitea repository secrets (Repo Settings -> Actions -> Secrets)."
            exit 1
          fi
          npm_registry="$(npm config get registry --userconfig .npmrc)"
          test -n "$npm_registry"
          npm_host="$(node -e "console.log(new URL(process.argv[1]).host)" "$npm_registry")"
          npm_auth="$(printf '%s:%s' "$NPM_USER" "$NPM_PASS" | base64 | tr -d '\n')"
          cp .npmrc .npmrc.ci
          {
            echo "//$npm_host/:_auth=$npm_auth"
            echo "ignore-scripts=true"
          } >> .npmrc.ci
          echo "Configured npm auth for $npm_host."

      - name: Diagnostic DNS and Registry Network Check
        run: |
          echo "=========================================================="
          echo "Checking host/container DNS resolution for ${{ vars.REGISTRY_HOST }}..."
          echo "--- Local /etc/hosts ---"
          cat /etc/hosts
          echo "--- Local Resolution (getent) ---"
          getent hosts "${{ vars.REGISTRY_HOST }}" || echo "getent hosts: unresolved"
          echo "--- Host DNS Resolution (nslookup) ---"
          nslookup "${{ vars.REGISTRY_HOST }}" || echo "nslookup: failed"
          echo "--- HTTP Connectivity (curl with timeout) ---"
          curl --connect-timeout 2 --max-time 3 -Is "http://${{ vars.REGISTRY_HOST }}/v2/" || echo "curl docker: connection failed or timed out"
          echo "=========================================================="

      - name: Log in to the internal registry
        run: |
          echo "Logging in to Docker registry ${{ vars.REGISTRY_HOST }}..."
          echo "${{ secrets.REGISTRY_PASS }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          echo "Successfully authenticated with ${{ vars.REGISTRY_HOST }}."

      - name: Build image (Next.js standalone)
        run: |
          echo "Building builder stage to capture source maps for GlitchTip..."
          docker build \
            --target builder \
            --secret id=npmrc,src=.npmrc.ci \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_CDN_URL="${{ vars.NEXT_PUBLIC_CDN_URL }}" \
            --build-arg NEXT_PUBLIC_DEBUG_AUTH="${{ vars.NEXT_PUBLIC_DEBUG_AUTH }}" \
            --build-arg NEXT_PUBLIC_GLITCHTIP_DSN="${{ steps.env_info.outputs.glitchtip_dsn }}" \
            --build-arg SENTRY_RELEASE="${{ steps.env_info.outputs.release_name }}" \
            --build-arg SENTRY_ENVIRONMENT="${{ steps.env_info.outputs.env_name }}" \
            -t frontend-builder .

          echo "Building hardened production image (stripping all .map files for security)..."
          docker build \
            --secret id=npmrc,src=.npmrc.ci \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_CDN_URL="${{ vars.NEXT_PUBLIC_CDN_URL }}" \
            --build-arg NEXT_PUBLIC_DEBUG_AUTH="${{ vars.NEXT_PUBLIC_DEBUG_AUTH }}" \
            --build-arg NEXT_PUBLIC_GLITCHTIP_DSN="${{ steps.env_info.outputs.glitchtip_dsn }}" \
            --build-arg SENTRY_RELEASE="${{ steps.env_info.outputs.release_name }}" \
            --build-arg SENTRY_ENVIRONMENT="${{ steps.env_info.outputs.env_name }}" \
            -t "${IMAGE}:${{ steps.env_info.outputs.image_tag }}" .
          echo "Docker image build completed."

      - name: Upload Source Maps to GlitchTip
        if: ${{ secrets.GLITCHTIP_AUTH_TOKEN != '' }}
        env:
          GLITCHTIP_AUTH_TOKEN: "${{ secrets.GLITCHTIP_AUTH_TOKEN }}"
        run: |
          echo "=========================================================="
          echo "Installing GlitchTip CLI and uploading source maps..."
          echo "=========================================================="
          curl -fsSL https://glitchtip.com/install.sh | sh
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

          CLI_PATH="$(command -v glitchtip-cli || echo "$HOME/.local/bin/glitchtip-cli")"
          echo "GlitchTip CLI located at: ${CLI_PATH}"

          docker run --rm \
            -v "${CLI_PATH}:/usr/local/bin/glitchtip-cli:ro" \
            -e SENTRY_URL="${{ vars.GLITCHTIP_URL || 'https://errors.inshop.social' }}" \
            -e SENTRY_AUTH_TOKEN="${{ secrets.GLITCHTIP_AUTH_TOKEN }}" \
            -e SENTRY_ORG="${{ vars.GLITCHTIP_ORG || 'inshop' }}" \
            -e SENTRY_PROJECT="${{ vars.GLITCHTIP_PROJECT || 'inshop-app' }}" \
            frontend-builder \
            sh -c '
              set -uo pipefail
              RELEASE="${{ steps.env_info.outputs.release_name }}"

              echo "=== GLITCHTIP CLI DIAGNOSTIC CONFIG ==="
              echo "SENTRY_URL:      ${SENTRY_URL}"
              echo "SENTRY_ORG:      ${SENTRY_ORG}"
              echo "SENTRY_PROJECT:  ${SENTRY_PROJECT}"
              echo "RELEASE:         ${RELEASE}"
              echo "AUTH_TOKEN_LEN:  ${#SENTRY_AUTH_TOKEN}"
              echo "CLI_VER:         $(glitchtip-cli --version)"
              echo "STATIC_MAPS_CNT: $(find .next/static -name "*.map" 2>/dev/null | wc -l)"
              echo "SERVER_MAPS_CNT: $(find .next/server -name "*.map" 2>/dev/null | wc -l)"
              echo "======================================="

              echo "--- 1. Testing GlitchTip Connection ---"
              glitchtip-cli info || echo "[WARN] glitchtip-cli info returned non-zero (continuing)..."

              echo "--- 2. Creating Release: ${RELEASE} ---"
              glitchtip-cli releases new "${RELEASE}" --org "${SENTRY_ORG}" --project "${SENTRY_PROJECT}" || echo "[WARN] Release create returned non-zero (continuing)..."

              echo "--- 3. Injecting Debug IDs into .next ---"
              glitchtip-cli sourcemaps inject .next

              echo "--- 4. Uploading Client Static Source Maps (~/_next/static) ---"
              glitchtip-cli sourcemaps upload .next/static \
                --release "${RELEASE}" \
                --url-prefix "~/_next/static" \
                --org "${SENTRY_ORG}" \
                --project "${SENTRY_PROJECT}" \
                --validate || echo "[WARN] Client sourcemap upload returned non-zero (continuing)..."

              echo "--- 5. Uploading Server Source Maps (~/_next/server) ---"
              glitchtip-cli sourcemaps upload .next/server \
                --release "${RELEASE}" \
                --url-prefix "~/_next/server" \
                --org "${SENTRY_ORG}" \
                --project "${SENTRY_PROJECT}" \
                --validate || echo "[WARN] Server sourcemap upload returned non-zero (continuing)..."

              echo "--- 6. Finalizing Release in GlitchTip ---"
              glitchtip-cli releases finalize "${RELEASE}" --org "${SENTRY_ORG}" --project "${SENTRY_PROJECT}" || echo "[WARN] Finalize returned non-zero (continuing)..."

              echo "--- 7. Verifying Releases in GlitchTip ---"
              glitchtip-cli releases list --org "${SENTRY_ORG}" --project "${SENTRY_PROJECT}" || echo "[WARN] Could not list releases"
              echo "=========================================================="
            '
          docker rmi frontend-builder || true
          echo "GlitchTip source maps upload completed."

      - name: Push and capture digest
        id: push
        run: |
          echo "Pushing built image to registry..."
          docker push "${IMAGE}:${{ steps.env_info.outputs.image_tag }}"
          echo "Image pushed successfully. Capturing repo digest..."
          digest=$(docker inspect --format='${{ '{{' }} index .RepoDigests 0 ${{ '}}' }}' "${IMAGE}:${{ steps.env_info.outputs.image_tag }}")
          echo "Captured Repo Digest: ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-test-push
    runs-on: swarm-deploy
    env:
      SERVICE: "${{ needs.build-test-push.outputs.service }}"
    steps:
      - name: Log in to the internal registry (so --with-registry-auth can pull)
        run: |
          echo "Logging in to Docker registry ${{ vars.REGISTRY_HOST }}..."
          echo "${{ secrets.REGISTRY_PASS }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          echo "Successfully authenticated with ${{ vars.REGISTRY_HOST }}."

      - name: Deploy the exact digest
        run: |
          set -euo pipefail
          DIGEST="${{ needs.build-test-push.outputs.digest }}"

          if ! docker service inspect "${SERVICE}" >/dev/null 2>&1; then
            echo "::error::Service '${SERVICE}' does not exist in Docker Swarm."
            echo "=========================================================================="
            echo "ERROR: Service '${SERVICE}' is not deployed."
            echo "The application stack must be initialized via Ansible before CI/CD can update it."
            echo "Please run the following command on the swarm manager to deploy the stack first:"
            echo "  make deploy-app BACKEND_TAG=<git-sha> FRONTEND_TAG=<git-sha>"
            echo "=========================================================================="
            exit 1
          fi

          echo "Updating Docker Swarm service: ${SERVICE}"
          echo "Target Image Digest: ${DIGEST}"
          docker service update \
            --image "${DIGEST}" \
            --update-order start-first \
            --update-failure-action rollback \
            --with-registry-auth \
            "${SERVICE}"
          echo "Swarm service update request successfully sent."

      - name: Verify service status
        run: |
          set -euo pipefail
          echo "=========================================================="
          echo "Verifying Docker Swarm tasks for service: ${SERVICE}..."
          echo "=========================================================="
          docker service ps "${SERVICE}" --filter "desired-state=running" --no-trunc

          running_count=$(docker service ps "${SERVICE}" --filter "desired-state=running" -q | wc -l | tr -d ' ')
          echo "Active running tasks: ${running_count}"

          if [ "${running_count}" -gt 0 ]; then
            echo "=========================================================="
            echo "SUCCESS: Frontend deployment is healthy and ${running_count} task(s) are active!"
            echo "=========================================================="
            exit 0
          else
            echo "::error::No running tasks found for service ${SERVICE}."
            exit 1
          fi
