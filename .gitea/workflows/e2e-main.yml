# =============================================================================
# Real-backend E2E gate for the frontend `main` branch.
#
# Runs on pull requests into main and on pushes to main. It builds the frontend
# from this commit and the backend from the backend's main branch, starts the
# throwaway stack from e2e-real/stack, and runs the Playwright suite against it.
# Branch protection on main should require this job to pass before merging.
#
# Secrets/vars:
#   BACKEND_CHECKOUT_TOKEN  read access to Mohsen/inshop-backend (CI checkout only)
#   MINIO_IMAGE, MINIO_MC_IMAGE (vars, optional) mirrored MinIO images
# =============================================================================
name: e2e-main

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  e2e-real:
    runs-on: docker
    timeout-minutes: 40
    env:
      BACKEND_DIR: ${{ github.workspace }}/.backend
      COMPOSE_FILE: e2e-real/stack/docker-compose.e2e.yml
      MINIO_IMAGE: ${{ vars.MINIO_IMAGE }}
      MINIO_MC_IMAGE: ${{ vars.MINIO_MC_IMAGE }}
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend main
        env:
          BACKEND_CHECKOUT_TOKEN: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://oauth2:${BACKEND_CHECKOUT_TOKEN}@git.inshop.social/Mohsen/inshop-backend.git" \
            "${BACKEND_DIR}"

      - name: Start the E2E stack
        run: |
          set -euo pipefail
          docker compose -f "${COMPOSE_FILE}" up -d --build --wait

      - name: Build the Playwright runner
        run: |
          set -euo pipefail
          docker build -f e2e-real/runner/Dockerfile -t inshop-e2e-runner:ci .

      - name: Run the real-backend suite
        run: |
          set -euo pipefail
          docker run --rm --shm-size=1g --network host \
            -e CI=true \
            -e E2E_BASE_URL=http://localhost:4100 \
            -e E2E_API_URL=http://localhost:8100 \
            -e E2E_DATABASE_URL=postgres://postgres:e2e-postgres-password@localhost:5435/inshop_e2e \
            inshop-e2e-runner:ci

      - name: Save stack logs
        if: always()
        run: |
          set -uo pipefail
          mkdir -p test-results
          docker compose -f "${COMPOSE_FILE}" logs --no-color > test-results/stack.log 2>&1 || true

      - name: Tear down the stack
        if: always()
        run: docker compose -f "${COMPOSE_FILE}" down -v --remove-orphans
