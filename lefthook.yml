# Lefthook Git hooks configuration
# Runs linting, testing, scoped mutation testing, and building locally before every git push.
# Reference: https://github.com/evilmartians/lefthook

pre-push:
  commands:
    lint:
      run: npm run lint
    test:
      run: npm run test
    mutation:
      run: node scripts/pre-push-mutation.mjs
    build:
      run: npm run build
